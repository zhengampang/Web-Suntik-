<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Pesanan - Boost Sosmed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Kotak Hasil Cek Status */
        .result-box {
            display: none;
            margin-top: 20px;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
        }

        .result-box p {
            margin-bottom: 8px;
            color: #94a3b8;
        }

        .result-box span {
            color: #f8fafc;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background-color: #eab308;
            color: #000;
        }

        .nav-link {
            text-align: center;
            margin-top: 20px;
        }

        .nav-link a {
            color: #38bdf8;
            font-size: 13px;
            text-decoration: none;
        }

        .nav-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔍 Cek Status Pesanan</h2>
        <form id="checkForm" onsubmit="handleCheck(event)">
            <div class="form-group">
                <label for="orderId">ID Pesanan / Nomor Transaksi</label>
                <input type="text" id="orderId" placeholder="Contoh: #BST-88392" required>
            </div>

            <button type="submit" class="btn-submit">Cek Status</button>
        </form>

        <!-- Hasil Simulasi Status -->
        <div class="result-box" id="resultBox">
            <p>ID Pesanan: <span id="resId">-</span></p>
            <p>Layanan: <span id="resService">TikTok Followers (1.000)</span></p>
            <p>Target: <span id="resTarget">@namapengguna</span></p>
            <p>Status: <span class="status-badge">Sedang Diproses (Processing)</span></p>
        </div>

        <div class="nav-link">
            <a href="index.html">&larr; Kembali ke Menu Pemesanan</a>
        </div>
    </div>

    <script>
        function handleCheck(event) {
            event.preventDefault();
            const orderId = document.getElementById('orderId').value;
            
            // Masukin nilai ID pesanan ke teks hasil
            document.getElementById('resId').innerText = orderId;
            
            // Munculkan kotak hasil
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
