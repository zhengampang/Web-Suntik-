<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suntik Followers Sosmed - Panel Tercepat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
        }

        .price-box {
            background-color: #0f172a;
            border: 1px dashed #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .price-box span {
            color: #38bdf8;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .footer-note {
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #64748b;
        }

        /* Modal / Popup Sukses */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            border: 1px solid #334155;
        }

        .modal-content h3 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .btn-close {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Boost Sosmed Panel</h2>
        <form id="boostForm" onsubmit="handleSubmit(event)">
            
            <div class="form-group">
                <label for="platform">Pilih Platform</label>
                <select id="platform" required>
                    <option value="" disabled selected>-- Pilih Layanan --</option>
                    <option value="TikTok">TikTok (Followers / Likes)</option>
                    <option value="Instagram">Instagram (Followers / Likes)</option>
                    <option value="YouTube">YouTube (Subscribers / Views)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username / Link Target</label>
                <input type="text" id="username" placeholder="Contoh: @namapengguna" required>
            </div>

            <div class="form-group">
                <label for="package">Pilih Jumlah Paket</label>
                <select id="package" onchange="hitungHarga()" required>
                    <option value="" disabled selected>-- Pilih Jumlah --</option>
                    <option value="1000" data-price="3000">1.000 Followers</option>
                    <option value="5000" data-price="6000">5.000 Followers</option>
                    <option value="10000" data-price="12000">10.000 Followers</option>
                </select>
            </div>

            <div class="price-box">
                Total Harga: <span id="totalHarga">Rp 0</span>
            </div>

            <button type="submit" class="btn-submit">Proses Sekarang</button>
        </form>
        <div class="footer-note">
            &copy; 2026 SMM Panel System. Aman & Cepat.
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h3>🎉 Pesanan Berhasil!</h3>
            <p id="modalText">Pesanan kamu sedang diproses oleh sistem.</p>
            <button class="btn-close" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        function hitungHarga() {
            const selectPackage = document.getElementById('package');
            const selectedOption = selectPackage.options[selectPackage.selectedIndex];
            const price = selectedOption.getAttribute('data-price');
            
            const totalHargaElem = document.getElementById('totalHarga');
            if (price) {
                totalHargaElem.innerText = "Rp " + Number(price).toLocaleString('id-ID');
            } else {
                totalHargaElem.innerText = "Rp 0";
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            const platform = document.getElementById('platform').value;
            const username = document.getElementById('username').value;
            const selectPackage = document.getElementById('package');
            const jumlah = selectPackage.value;

            document.getElementById('modalText').innerText = 
                `Pesanan ${jumlah} untuk akun ${platform} (${username}) telah masuk antrean sistem!`;
            
            document.getElementById('successModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
            document.getElementById('boostForm').reset();
            document.getElementById('totalHarga').innerText = "Rp 0";
        }
    </script>
<div style="text-align: center; margin-top: 15px;">
    <a href="layanan.html" style="color: #38bdf8; font-size: 13px; text-decoration: none; margin: 0 5px;">Layanan</a> | 
    <a href="tracking.html" style="color: #38bdf8; font-size: 13px; text-decoration: none; margin: 0 5px;">Cek Status</a> | 
    <a href="faq.html" style="color: #38bdf8; font-size: 13px; text-decoration: none; margin: 0 5px;">Bantuan</a>
</div>

</body>
</html>
